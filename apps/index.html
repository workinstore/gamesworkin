<!--Início do Código do Efeito de Pó de Brilho no Mouse (v2)-->
<div id="mouse-glitter-container">
    <meta charset="UTF-8">
    <style>
        #mouse-glitter-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* não interfere em cliques */
            z-index: 99999;
        }
    </style>

    <script>
        (function () {
            if (window.glitterEffectLoaded) return;
            window.glitterEffectLoaded = true;

            function init() {
                var canvas = document.createElement('canvas');
                canvas.id = 'mouse-glitter-canvas';
                document.body.appendChild(canvas);
                var ctx = canvas.getContext('2d');
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                var W = 0, H = 0;

                function resize() {
                    W = window.innerWidth; H = window.innerHeight;
                    canvas.width = W * dpr; canvas.height = H * dpr;
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }
                resize();
                window.addEventListener('resize', resize);

                // Paleta de brilho: prata, branco e reflexos dourados/cristal
                var colors = [
                    [255, 255, 255], [255, 255, 255], [235, 240, 255],
                    [210, 220, 235], [255, 236, 170], [255, 215, 120], [200, 230, 255]
                ];

                var particles = [];
                var MAX = 900;
                var lastX = null, lastY = null;

                function spawn(x, y, vxBase, vyBase) {
                    if (particles.length >= MAX) particles.shift();
                    var c = colors[(Math.random() * colors.length) | 0];
                    var angle = Math.random() * Math.PI * 2;
                    var speed = Math.random() * 1.6 + 0.2;
                    particles.push({
                        x: x + (Math.random() - 0.5) * 10,
                        y: y + (Math.random() - 0.5) * 10,
                        vx: Math.cos(angle) * speed + vxBase * 0.08,
                        vy: Math.sin(angle) * speed + vyBase * 0.08,
                        size: Math.random() * 1.4 + 0.4,       // minúsculas: 0.4px a 1.8px
                        life: 0,
                        maxLife: Math.random() * 35 + 25,      // somem rápido (~0.4s a 1s)
                        twinkle: Math.random() * Math.PI * 2,
                        twSpeed: Math.random() * 0.5 + 0.3,
                        star: Math.random() < 0.12,            // algumas viram "estrelinhas" cintilantes
                        c: c
                    });
                }

                document.addEventListener('mousemove', function (e) {
                    var x = e.clientX, y = e.clientY;
                    if (lastX === null) { lastX = x; lastY = y; }
                    var dx = x - lastX, dy = y - lastY;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    // Quanto mais rápido o movimento, mais pó de brilho
                    var count = Math.min(6 + dist * 0.6, 28) | 0;
                    for (var i = 0; i < count; i++) {
                        var t = Math.random();
                        spawn(lastX + dx * t, lastY + dy * t, dx, dy);
                    }
                    lastX = x; lastY = y;
                }, { passive: true });

                document.addEventListener('mouseleave', function () { lastX = null; lastY = null; });

                function drawStar(p, alpha) {
                    var len = p.size * 5 * alpha;
                    ctx.strokeStyle = 'rgba(' + p.c[0] + ',' + p.c[1] + ',' + p.c[2] + ',' + alpha + ')';
                    ctx.lineWidth = 0.6;
                    ctx.beginPath();
                    ctx.moveTo(p.x - len, p.y); ctx.lineTo(p.x + len, p.y);
                    ctx.moveTo(p.x, p.y - len); ctx.lineTo(p.x, p.y + len);
                    ctx.stroke();
                }

                function loop() {
                    ctx.clearRect(0, 0, W, H);
                    ctx.globalCompositeOperation = 'lighter'; // soma de luz = brilho intenso

                    for (var i = particles.length - 1; i >= 0; i--) {
                        var p = particles[i];
                        p.life++;
                        if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }

                        p.vx *= 0.94; p.vy *= 0.94;   // desacelera como poeira no ar
                        p.vy += 0.025;                // cai levemente
                        p.x += p.vx; p.y += p.vy;
                        p.twinkle += p.twSpeed;

                        var lifeRatio = 1 - p.life / p.maxLife;
                        // Cintilação: pisca como lantejoula refletindo luz
                        var flicker = 0.35 + 0.65 * Math.abs(Math.sin(p.twinkle));
                        var alpha = lifeRatio * flicker;

                        // Halo suave
                        ctx.fillStyle = 'rgba(' + p.c[0] + ',' + p.c[1] + ',' + p.c[2] + ',' + (alpha * 0.25) + ')';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * 2.6, 0, Math.PI * 2);
                        ctx.fill();

                        // Núcleo brilhante
                        ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
                        ctx.fill();

                        if (p.star && flicker > 0.8) drawStar(p, alpha);
                    }

                    ctx.globalCompositeOperation = 'source-over';
                    requestAnimationFrame(loop);
                }
                requestAnimationFrame(loop);
            }

            if (document.body) init();
            else document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
